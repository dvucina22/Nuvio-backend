services:
  account-manager:
    build:
      context: ./services/account-service
      dockerfile: Dockerfile-service
    container_name: nuvio-account-manager
    env_file:
      - ./services/account-service/.env
    environment:
      ACCOUNT_PORT: 8001
    expose:
      - "8001"
    networks:
      - nuvio-network
    restart: unless-stopped

  catalog-manager:
    build:
      context: ./services/catalog-service
      dockerfile: Dockerfile-service
    container_name: nuvio-catalog-manager
    env_file:
      - ./services/catalog-service/.env
    environment:
      CATALOG_PORT: 8002
    expose:
      - "8002"
    networks:
      - nuvio-network
    restart: unless-stopped

  transaction-manager:
    build:
      context: ./services/transaction-service
      dockerfile: Dockerfile-service
    container_name: nuvio-transaction-manager
    env_file:
      - ./services/transaction-service/.env
    environment:
      TRANSACTION_PORT: 8003
    expose:
      - "8003"
    networks:
      - nuvio-network
    restart: unless-stopped  

  iso-com-manager:
    build:
      context: ./services/iso-com-service
      dockerfile: Dockerfile-service
    container_name: nuvio-iso-com-manager
    env_file:
      - ./services/iso-com-service/.env
    environment:
      TRANSACTION_PORT: 8004
    expose:
      - "8004"
    networks:
      - nuvio-network
    restart: unless-stopped  

  iso-host-manager:
    build:
      context: ./services/iso-host-service
      dockerfile: Dockerfile-service
    container_name: nuvio-iso-host-manager
    env_file:
      - ./services/iso-host-service/.env
    environment:
      TRANSACTION_PORT: 8005
    expose:
      - "8005"
    networks:
      - nuvio-network
    restart: unless-stopped  

  rest-com-manager:
    build:
      context: ./services/rest-com-service
      dockerfile: Dockerfile-service
    container_name: nuvio-rest-com-manager
    env_file:
      - ./services/rest-com-service/.env
    environment:
      REST_COM_PORT: 8006
      REST_HOST_ADDR: rest-host-manager:8007
    expose:
      - "8006"
    networks:
      - nuvio-network
    restart: unless-stopped

  rest-host-manager:
    build:
      context: ./services/rest-host-service
      dockerfile: Dockerfile-service
    container_name: nuvio-rest-host-manager
    env_file:
      - ./services/rest-host-service/.env
    environment:
      REST_HOST_PORT: 8007
      REST_HOST_ADDR: 0.0.0.0:8007
    expose:
      - "8007"
    networks:
      - nuvio-network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: nuvio-nginx
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt/live/nuvio.lol/fullchain.pem:/etc/nginx/ssl/fullchain.pem:ro
      - /etc/letsencrypt/live/nuvio.lol/privkey.pem:/etc/nginx/ssl/privkey.pem:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - account-manager
      - catalog-manager
      - transaction-manager
      - iso-com-manager
      - rest-com-manager
    networks:
      - nuvio-network
    restart: unless-stopped

networks:
  nuvio-network:
    driver: bridge
