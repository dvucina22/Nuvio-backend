services:
  account-manager:
    build:
      context: ./services/account-service
      dockerfile: Dockerfile-service
    container_name: nuvio-account-manager
    env_file:
      - ./services/account-service/.env
    environment:
      ACCOUNT_PORT: 8001
    expose:
      - "8001"
    networks:
      - nuvio-network
    restart: unless-stopped

  catalog-manager:
    build:
      context: ./services/catalog-service
      dockerfile: Dockerfile-service
    container_name: nuvio-catalog-manager
    env_file:
      - ./services/catalog-service/.env
    environment:
      CATALOG_PORT: 8002
    expose:
      - "8002"
    networks:
      - nuvio-network
    restart: unless-stopped

  transaction-manager:
    build:
      context: ./services/transaction-service
      dockerfile: Dockerfile-service
    container_name: nuvio-transaction-manager
    env_file:
      - ./services/transaction-service/.env
    environment:
      TRANSACTION_PORT: 8003
    expose:
      - "8003"
    networks:
      - nuvio-network
    restart: unless-stopped  

  nginx:
    image: nginx:alpine
    container_name: nuvio-nginx
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt/live/nuvio.lol/fullchain.pem:/etc/nginx/ssl/fullchain.pem:ro
      - /etc/letsencrypt/live/nuvio.lol/privkey.pem:/etc/nginx/ssl/privkey.pem:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - account-manager
      - catalog-manager
      - transaction-manager
    networks:
      - nuvio-network
    restart: unless-stopped

networks:
  nuvio-network:
    driver: bridge
