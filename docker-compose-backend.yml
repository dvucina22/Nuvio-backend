services:
  account-manager:
    build:
      context: ./services/account-service
      dockerfile: Dockerfile-service
    container_name: nuvio-account-manager
    env_file:
      - ./services/account-service/.env
    environment:
      ACCOUNT_PORT: 8001
    expose:
      - "8001" # expose internally to nginx
    networks:
      - nuvio-network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: nuvio-nginx
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt/live/nuvio.lol/fullchain.pem:/etc/nginx/ssl/fullchain.pem:ro
      - /etc/letsencrypt/live/nuvio.lol/privkey.pem:/etc/nginx/ssl/privkey.pem:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - account-manager
    networks:
      - nuvio-network
    restart: unless-stopped

networks:
  nuvio-network:
    driver: bridge